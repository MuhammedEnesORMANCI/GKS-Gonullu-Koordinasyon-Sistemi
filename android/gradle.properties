# Bellek: makinede backend, Docker ve VS Code da çalışıyor. Tek Gradle JVM'i; Kotlin derleyicisi ayrı
# daemon açmadan aynı süreçte çalışır. Boşta kalan daemon 15 dk sonra kapanır.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon.idletimeout=900000
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Backend API kökü. Varsayılan Android emülatörü içindir: 10.0.2.2 = geliştirme makinesinin localhost'u.
# Gerçek cihaz için local.properties'e (depoya girmez) yazın ya da -Pgks.apiBaseUrl=... verin, ör.:
#   gks.apiBaseUrl=http://192.168.1.20:8080/     (aynı Wi-Fi ağındaki geliştirme makinesi)
#   gks.apiBaseUrl=http://localhost:8080/        (USB ile: adb reverse tcp:8080 tcp:8080)
gks.apiBaseUrl=http://10.0.2.2:8080/
