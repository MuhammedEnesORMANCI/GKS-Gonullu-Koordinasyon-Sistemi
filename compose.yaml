# Yerel geliştirme ve demo servisleri (ADR-008, VS-11).
# Değerler kök dizindeki .env dosyasından okunur; şablon: .env.example.
# Portlar yalnızca bu makineye (127.0.0.1) açılır.
name: gks

services:
  postgres:
    image: postgres:16.16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB .env dosyasında tanımlı olmalı}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER .env dosyasında tanımlı olmalı}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlı olmalı}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:1025:1025"   # SMTP (davet e-postaları, K-06)
      - "127.0.0.1:8025:8025"   # Web arayüzü (yalnızca ekip)

volumes:
  pgdata:
